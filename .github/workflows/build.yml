name: Build MIDI++ Humanizer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build MIDI++ Release x64
        run: msbuild "MIDIPlusPlus-1.0.4.R5_Rel\MIDI++.sln" /m /p:Configuration=Release /p:Platform=x64

      - name: Prepare build artifact
        shell: powershell
        run: |
          Write-Host "Searching for MIDI++.exe..."

          $exe = Get-ChildItem -Path . -Recurse -Filter "MIDI++.exe" |
            Where-Object { $_.FullName -match "Release" } |
            Select-Object -First 1

          if (-not $exe) {
            throw "MIDI++.exe was not produced."
          }

          Write-Host "Found executable:"
          Write-Host $exe.FullName

          New-Item -ItemType Directory -Force -Path "dist"

          Copy-Item $exe.FullName "dist\MIDI++.exe"

          $config = "MIDIPlusPlus-1.0.4.R5_Rel\config.json"

          if (Test-Path $config) {
            Copy-Item $config "dist\config.json"
          }
          else {
            throw "config.json was not found at $config"
          }

          New-Item -ItemType Directory -Force -Path "dist\midi"

          Write-Host "Artifact contents:"
          Get-ChildItem -Path "dist" -Recurse

      - name: Upload finished MIDI++
        uses: actions/upload-artifact@v4
        with:
          name: MIDIPlusPlus-R5-Humanizer
          path: dist
          if-no-files-found: error
