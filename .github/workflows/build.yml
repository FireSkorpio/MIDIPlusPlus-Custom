name: Build MIDI++ Custom Build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional existing release tag to upload the finished ZIP to"
        required: false
        type: string
  push:
    branches:
      - main
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build MIDI++ Release x64
        run: msbuild "MIDIPlusPlus-1.0.4.R5_Rel\MIDI++.sln" /m /p:Configuration=Release /p:Platform=x64

      - name: Prepare finished package
        shell: powershell
        run: |
          $src = "MIDIPlusPlus-1.0.4.R5_Rel"
          $exe = Get-ChildItem -Path $src -Recurse -Filter "MIDI++.exe" |
            Where-Object { $_.FullName -match "x64\\Release" } |
            Select-Object -First 1

          if (-not $exe) {
            throw "MIDI++.exe was not produced."
          }

          if (-not (Test-Path "$src\config.json")) {
            throw "config.json was not found."
          }

          New-Item -ItemType Directory -Force -Path "dist"
          Copy-Item $exe.FullName "dist\MIDI++.exe"
          Copy-Item "$src\config.json" "dist\config.json"

          if (Test-Path "$src\HUMANIZER.md") {
            Copy-Item "$src\HUMANIZER.md" "dist\HUMANIZER.md"
          }

          if (Test-Path "README.md") {
            Copy-Item "README.md" "dist\README.md"
          }
          if (Test-Path "NOTICE.md") {
            Copy-Item "NOTICE.md" "dist\NOTICE.md"
          }
          if (Test-Path "LICENSE") {
            Copy-Item "LICENSE" "dist\LICENSE"
          }
          if (Test-Path "THIRD_PARTY_NOTICES.md") {
            Copy-Item "THIRD_PARTY_NOTICES.md" "dist\THIRD_PARTY_NOTICES.md"
          }
          if (Test-Path "LICENSES") {
            Copy-Item "LICENSES" "dist\LICENSES" -Recurse
          }

          New-Item -ItemType Directory -Force -Path "dist\midi" | Out-Null
          "Place .mid/.midi files here, or drag MIDI files directly onto MIDI++." |
            Set-Content "dist\midi\README.txt"

          Write-Host "Package contents:"
          Get-ChildItem -Path "dist" -Recurse

      - name: Create downloadable release ZIP
        shell: powershell
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          $tag = $env:RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "MIDIPlusPlus-Custom-Build"
          }

          $safeTag = $tag -replace '^MIDI\+\+', 'MIDIPlusPlus'
          $safeTag = $safeTag -replace '[^A-Za-z0-9._-]', '-'
          $zip = "$safeTag.zip"

          Compress-Archive -Path "dist\*" -DestinationPath $zip -Force
          "RELEASE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Created $zip"

      - name: Upload finished MIDI++ build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MIDIPlusPlus-Custom-Build
          path: dist
          if-no-files-found: error

      - name: Attach ZIP to GitHub Release
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          gh release upload "$env:RELEASE_TAG" "$env:RELEASE_ZIP" --clobber --repo "${{ github.repository }}"
