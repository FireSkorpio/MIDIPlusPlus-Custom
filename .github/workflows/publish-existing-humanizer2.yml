name: Fix Humanizer 2.0 Release Notes

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-existing-humanizer2.yml"

permissions:
  contents: write

jobs:
  update-notes:
    runs-on: ubuntu-latest

    steps:
      - name: Update release asset filename in notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          tag = "MIDI++-Humanizer-2.0"
          body = subprocess.check_output(
              ["gh", "release", "view", tag, "--repo", repo, "--json", "body", "--jq", ".body"],
              text=True,
          )
          body = body.replace("MIDIPlusPlus-Custom-Build.zip", "MIDIPlusPlus-Humanizer-2.0.zip")
          Path("release-notes.md").write_text(body, encoding="utf-8")
          PY

          gh release edit "MIDI++-Humanizer-2.0" \
            --repo "${{ github.repository }}" \
            --notes-file release-notes.md
