name: Apply and Build QoL Update

on:
  push:
    branches:
      - feature/qol-update
    paths:
      - tools/apply_qol_update.py
      - tools/apply_qol_update_v2.py
      - .github/workflows/qol-apply-build.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout QoL branch
        uses: actions/checkout@v4
        with:
          ref: feature/qol-update
          fetch-depth: 0

      - name: Apply QoL source patch
        run: python tools/apply_qol_update_v2.py

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build MIDI++ Release x64
        run: msbuild "MIDIPlusPlus-1.0.4.R5_Rel\MIDI++.sln" /m /p:Configuration=Release /p:Platform=x64

      - name: Prepare test package
        shell: powershell
        run: |
          $src = "MIDIPlusPlus-1.0.4.R5_Rel"
          $exe = Get-ChildItem -Path $src -Recurse -Filter "MIDI++.exe" |
            Where-Object { $_.FullName -match "x64\\Release" } |
            Select-Object -First 1
          if (-not $exe) { throw "MIDI++.exe was not produced." }

          New-Item -ItemType Directory -Force -Path "dist"
          Copy-Item $exe.FullName "dist\MIDI++.exe"
          Copy-Item "$src\config.json" "dist\config.json"
          Copy-Item "$src\HUMANIZER.md" "dist\HUMANIZER.md"
          New-Item -ItemType Directory -Force -Path "dist\midi" | Out-Null
          "Place .mid/.midi files here, or drag MIDI files directly onto MIDI++." | Set-Content "dist\midi\README.txt"

      - name: Upload QoL test build
        uses: actions/upload-artifact@v4
        with:
          name: MIDIPlusPlus-QoL-Test-Build
          path: dist
          if-no-files-found: error

      - name: Commit validated QoL source
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "MIDIPlusPlus-1.0.4.R5_Rel" "UPDATE_NOTES.md"
          if (-not (git status --porcelain)) {
            Write-Host "No generated source changes to commit."
            exit 0
          }
          git commit -m "Implement MIDI++ QoL update [skip ci]"
          git push origin HEAD:feature/qol-update
