name: Package MIDI++ Humanizer 2.0.1

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-humanizer-2.0.1.yml"

permissions:
  contents: write
  actions: write

jobs:
  package-release:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch release package build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f release_tag="MIDI++-Humanizer-2.0.1"
