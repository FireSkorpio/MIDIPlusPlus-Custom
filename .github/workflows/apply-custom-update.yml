name: Apply Custom Build source update

on:
  push:
    branches: [main]
    paths:
      - '.update/APPLY'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source patch
        shell: bash
        run: |
          cat .update/part-*.patch > /tmp/custom-build.patch
          git apply --whitespace=nowarn /tmp/custom-build.patch
          rm -rf .update

      - name: Commit updated source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Apply MIDI++ Custom Build source update"
          git push origin HEAD:main
