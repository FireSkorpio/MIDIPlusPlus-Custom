name: Build Humanizer 2.0

on:
  push:
    branches:
      - feature/humanizer-2.0
    paths:
      - tools/apply_humanizer2.py
      - .github/workflows/humanizer2-build.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Humanizer 2.0 branch
        uses: actions/checkout@v4
        with:
          ref: feature/humanizer-2.0
          fetch-depth: 0

      - name: Apply Humanizer 2.0 patch
        run: python tools/apply_humanizer2.py

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build MIDI++ Release x64
        run: msbuild "MIDIPlusPlus-1.0.4.R5_Rel\MIDI++.sln" /m /p:Configuration=Release /p:Platform=x64

      - name: Prepare test package
        shell: powershell
        run: |
          $src = "MIDIPlusPlus-1.0.4.R5_Rel"
          $exe = Get-ChildItem -Path $src -Recurse -Filter "MIDI++.exe" |
            Where-Object { $_.FullName -match "x64\\Release" } |
            Select-Object -First 1
          if (-not $exe) { throw "MIDI++.exe was not produced." }

          New-Item -ItemType Directory -Force -Path "dist"
          Copy-Item $exe.FullName "dist\MIDI++.exe"
          Copy-Item "$src\config.json" "dist\config.json"
          Copy-Item "$src\HUMANIZER.md" "dist\HUMANIZER.md"
          New-Item -ItemType Directory -Force -Path "dist\midi" | Out-Null
          "Place .mid/.midi files here. Humanizer 2.0 experimental features are documented in HUMANIZER.md." | Set-Content "dist\midi\README.txt"

      - name: Upload Humanizer 2.0 test build
        uses: actions/upload-artifact@v4
        with:
          name: MIDIPlusPlus-Humanizer2-Test
          path: dist
          if-no-files-found: error

      - name: Commit validated Humanizer 2.0 source
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "MIDIPlusPlus-1.0.4.R5_Rel/config.hpp" `
                  "MIDIPlusPlus-1.0.4.R5_Rel/ConfigHandler.cpp" `
                  "MIDIPlusPlus-1.0.4.R5_Rel/PlaybackCore.cpp" `
                  "MIDIPlusPlus-1.0.4.R5_Rel/MIDI++.cpp" `
                  "MIDIPlusPlus-1.0.4.R5_Rel/config.json" `
                  "MIDIPlusPlus-1.0.4.R5_Rel/HUMANIZER.md" `
                  "UPDATE_NOTES.md"
          if (-not (git status --porcelain)) {
            Write-Host "No generated source changes to commit."
            exit 0
          }
          git commit -m "Implement Humanizer 2.0 [skip ci]"
          git push origin HEAD:feature/humanizer-2.0
